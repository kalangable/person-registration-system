# ==============================================================================
# Foundation Service - Configuração de Desenvolvimento
# ==============================================================================

# Database Configuration (Development)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/foundationdb
    username: postgres
    password: postgres
  
  # JPA Configuration (Development)
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

# Server Configuration (Development)
server:
  port: 8080
  error:
    include-stacktrace: on_param

# Actuator Configuration (Development)
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

# Logging Configuration (Development)
logging:
  level:
    root: INFO
    com.akstack.foundation: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    liquibase: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr([%thread]){magenta} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"
