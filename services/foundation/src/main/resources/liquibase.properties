# Liquibase Properties - Development Configuration
# Este arquivo é usado pelo liquibase-maven-plugin para execução manual das migrations
# 
# IMPORTANTE: O Maven não lê variáveis do arquivo .env automaticamente.
# Você tem 3 opções:
#
# 1. RECOMENDADO - Passar via linha de comando:
#    mvn liquibase:update -pl services/foundation \
#      -Dliquibase.url=jdbc:postgresql://localhost:5432/foundationdb \
#      -Dliquibase.username=postgres \
#      -Dliquibase.password=postgres
#
# 2. Usar valores hardcoded aqui (apenas para dev local)
# 3. Exportar variáveis de ambiente no terminal antes de rodar o Maven

# Changelog
changeLogFile=src/main/resources/db/changelog/db.changelog-master.xml

# Database Connection - VALORES HARDCODED PARA DESENVOLVIMENTO LOCAL
# Altere conforme sua configuração local do PostgreSQL
url=jdbc:postgresql://localhost:5432/akstack_foundation
username=akstack
password=akstack123
driver=org.postgresql.Driver

# Schema
defaultSchemaName=public

# Liquibase Configuration
contexts=dev

# Output
verbose=true
